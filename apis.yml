name: Pozen
description: >-
  POZEN Inc. was a specialty pharmaceutical company headquartered in Chapel Hill,
  North Carolina, founded in 1996 and focused on developing therapeutics for pain
  and pain-related conditions, most notably acute migraine. It was best known for the
  products Treximet (sumatriptan/naproxen) and Vimovo (naproxen/esomeprazole). POZEN
  traded publicly on NASDAQ under the ticker POZN and in 2016 combined with Tribute
  Pharmaceuticals to form Aralez Pharmaceuticals. Pozen was surfaced as a portfolio
  company of Canaan Partners and added to the API Evangelist network as a stub. As a
  pharmaceutical company it operated no public developer program, API, or SDK surface;
  an enrichment pass confirmed no API artifacts exist to harvest.
